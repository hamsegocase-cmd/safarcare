<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafarCare — App Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy2:#13305A;--turq:#2EC4B6;--turqD:#0B7A75;--tint:#DDF4F1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#E9EDF3;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 12px;color:#0B1F3A}
body[data-theme=dark]{background:#030a16;color:#E8EEF6}
.intro{max-width:560px;text-align:center;font-size:14px;line-height:1.5}
.intro h1{font-family:Manrope,sans-serif;margin:0 0 4px;font-size:22px}
.intro p{margin:0;opacity:.8}
#phone{--bg:#F4F6FA;--card:#fff;--muted:#5B6B82;--text:#0B1F3A;--soft:#E7EDF6;--line:#E3E9F1;--hero:#0B1F3A;--acc:#0B7A75;--tintc:#DDF4F1;--warnbg:#FFF8EC;--warnfg:#8A5300;--warnb:#F3D9A8;
 width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);box-shadow:0 0 0 10px #0B1F3A,0 30px 60px rgba(11,31,58,.35);display:flex;flex-direction:column}
#phone[data-theme=dark]{--bg:#07142A;--card:#0F2440;--muted:#9FB0C7;--text:#E8EEF6;--soft:#1A3354;--line:#1A3354;--hero:#13305A;--acc:#2EC4B6;--tintc:rgba(46,196,182,.16);--warnbg:#3A2A10;--warnfg:#F6C77A;--warnb:#3A2A10}
#phone[dir=rtl]{font-family:'IBM Plex Sans Arabic',Inter,sans-serif}
#phone[dir=rtl] .flip{transform:scaleX(-1)}
@media (max-width:500px){body{padding:0}.intro{padding:16px 16px 0}#phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:16px 20px 28px;display:flex;flex-direction:column;gap:12px}
.pb{padding-bottom:100px}
.appbar{display:flex;align-items:center;gap:10px;padding:46px 16px 8px}
.appbar h1{font-family:Manrope,'IBM Plex Sans Arabic',sans-serif;font-size:20px;font-weight:800;margin:0}
#phone[dir=rtl] .appbar h1,#phone[dir=rtl] h2,#phone[dir=rtl] .h2,#phone[dir=rtl] .h3,#phone[dir=rtl] .hero-t{font-family:'IBM Plex Sans Arabic',sans-serif}
h2{font-family:Manrope,sans-serif;font-size:17px;margin:10px 0 0}
h3{font-size:15px;margin:8px 0 0}
p{margin:0;line-height:1.5}
.h2{font-family:Manrope,sans-serif;font-size:20px;font-weight:800}
.h3{font-family:Manrope,sans-serif;font-size:17px;font-weight:700}
.small{font-size:13px;line-height:1.45}.xs{font-size:12px;line-height:1.4}
.muted{color:var(--muted)}.acc{color:var(--acc)}.center{text-align:center}.upper{text-transform:uppercase;letter-spacing:.06em}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}.row.top{align-items:flex-start}.mt{margin-top:14px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:16px;border:0;box-shadow:0 1px 2px rgba(11,31,58,.06);text-align:start;width:100%;display:block}
.card.row{display:flex}.card.nopad{padding:0;overflow:hidden}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:22px;border:0;background:var(--tintc);color:var(--acc);display:flex;align-items:center;justify-content:center}
.logo{display:inline-flex;background:var(--navy);border-radius:30%;align-items:center;justify-content:center}
.hero{position:relative;overflow:hidden;background:var(--hero);border-radius:24px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:6px}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(46,196,182,.3);inset-inline-end:-40px;top:-40px;width:170px;height:170px}.ring.r2{inset-inline-end:-10px;top:-10px;width:110px;height:110px}
.eyebrow{color:var(--turq);font-weight:600;font-size:12px;letter-spacing:.08em}
#phone[dir=rtl] .eyebrow{letter-spacing:0}
.hero-t{font-family:Manrope,sans-serif;font-size:24px;font-weight:800;line-height:1.2;max-width:260px}
.hero-b{color:#B9C6D8;font-size:14px;line-height:1.45;max-width:280px;margin-bottom:10px}
.btn{height:52px;border:0;border-radius:16px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;width:100%}
#phone[data-theme=dark] .btn{background:var(--turq);color:var(--navy)}
.btn.turq{background:var(--turq);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:#C62828;color:#fff}
.small-btn{height:44px;width:auto;font-size:14px}
.link{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;padding:8px 0;display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative}
.sect{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.sect h2{margin:0}
.tile{width:40px;height:40px;border-radius:12px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tile.accent{background:var(--tintc);color:var(--acc)}.tile.big{width:72px;height:72px;border-radius:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool{display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:14px}
.journey{display:flex;flex-direction:column;gap:12px}
.code{font-family:Manrope,sans-serif;font-size:26px;font-weight:800}.code.big{font-size:32px}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.dash{display:flex;align-items:center;gap:6px;width:100%}.dash::before,.dash::after{content:"";flex:1;border-top:2px dashed var(--line)}
.dash.turq{color:var(--turq)}.dash.turq::before,.dash.turq::after{border-color:rgba(46,196,182,.6)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.tabs{height:78px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-start;padding-top:8px}
.nav{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500;padding:4px 0}
.nav.on{color:var(--text);font-weight:700}
.fab{width:58px;height:58px;margin:-26px 6px 0;border-radius:50%;border:0;background:var(--navy);color:var(--turq);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(11,31,58,.35)}
#phone[data-theme=dark] .fab{background:var(--turq);color:var(--navy)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px;background:var(--soft);font-size:13px;line-height:1.45}
.banner.warn{background:var(--warnbg);color:var(--warnfg);border:1px solid var(--warnb)}
.banner.ok{background:var(--tintc);color:var(--acc)}
.banner svg{flex-shrink:0}.banner b{display:block;margin-bottom:2px}
.scanvis{height:190px;background:var(--hero);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.frame{width:150px;height:116px;border:2px solid var(--turq);border-radius:18px;display:flex;align-items:center;justify-content:center}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(46,196,182,.25);border-top-color:var(--turq);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted-on-hero{color:#B9C6D8;font-size:14px}
.src{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;cursor:pointer}
.src.primary{background:var(--hero);color:#fff}.src.primary .xs{color:#B9C6D8}.turq{color:var(--turq)}
.preview-box{border:1.5px dashed var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.chipbtn{border:0;background:var(--tintc);color:var(--acc);border-radius:12px;padding:10px 12px;text-align:start;font-weight:600;font-size:13px}
textarea,input[type=text],input:not([type]),input[inputmode],input[type=datetime-local],input[type=date]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:14px}
.frow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:start}
.card.nopad>.frow:first-child{border-top:0}
.frow .val{margin-inline-start:auto;text-align:end}
.segh{padding:10px 8px 4px 16px}
.nf{background:var(--warnbg);color:var(--warnfg);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 24px;background:linear-gradient(transparent,var(--bg) 30%)}
.trip-hero{background:var(--hero);color:#fff;padding:46px 20px 20px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:14px}
.trip-hero .xs{color:#B9C6D8}.turqtxt{color:var(--turq)!important;font-weight:600}
.iconbtn.onhero{background:rgba(255,255,255,.1);color:#fff}
.bottomalign{align-items:flex-end}.end{text-align:end}
.det{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}.det b{text-align:end}
.prog{gap:16px}.ringp{--p:0;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--soft) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ringp span{width:46px;height:46px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ck{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 16px;border-top:1px solid var(--line)}.ck:first-child{border-top:0}
.cbx{display:flex;gap:12px;align-items:flex-start;flex:1;padding:10px 0;cursor:pointer}.cbx span{display:flex;flex-direction:column;gap:2px;font-size:14px}
.cbx input{width:22px;height:22px;accent-color:var(--acc);flex-shrink:0;margin-top:1px}.cbx.solo{flex:0;padding:0}
.struck{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.note{font-style:italic;margin-top:4px}
.hiddendate{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.code-row{margin-bottom:12px}
.path{display:flex;gap:10px;align-items:stretch}
.num{width:30px;height:30px;border-radius:50%;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-top:14px}
.num.soft{background:var(--tintc);color:var(--acc);margin-top:0}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.illus{height:130px;background:var(--hero);border-radius:24px;display:flex;align-items:center;justify-content:center;color:#fff}
.lead{font-size:16px}.step{display:flex;gap:12px;align-items:flex-start}
.glabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-top:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.radio{flex:1;position:relative}.radio input{position:absolute;opacity:0}.radio span{display:block;text-align:center;padding:10px 6px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:14px;cursor:pointer}
.radio input:checked+span{background:var(--tintc);border-color:var(--acc);color:var(--acc)}
.radio input:focus-visible+span{outline:2px solid var(--acc)}
.switch input{width:44px;height:24px;accent-color:var(--acc)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 10px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#13305A;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#dlg{position:fixed;inset:0;background:rgba(3,10,22,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#dlg[hidden]{display:none}
.dlg{background:#fff;color:#0B1F3A;border-radius:22px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
body[data-theme=dark] .dlg{background:#0F2440;color:#E8EEF6}
.dlg h2{margin:0}.fl{display:flex;flex-direction:column;gap:4px;font-size:13px}.end-row{justify-content:flex-end}.end-row .btn{width:auto;height:44px}
:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
</style>

dd your own item", "ckAddHint": "For example: Photocopy of passport", "ckEdit": "Edit item", "ck_passport": "Passport", "ck_passport_hint": "Have it with you and check the expiry date", "ck_ticket": "Flight ticket", "ck_ticket_hint": "Saved in SafarCare", "ck_visaCheck": "Visa requirements", "ck_visaCheck_hint": "Check with the embassy or immigration authority for {place}", "ck_transitDocuments": "Transit documents", "ck_transitDocuments_hint": "Ask your airline what you need to change planes in {stops}", "ck_hotel": "Hotel booking or address", "ck_hotel_hint": "If you have one, keep a copy", "ck_returnTicket": "Return or onward ticket", "ck_returnTicket_hint": "Check whether you will be asked for one", "ck_insurance": "Travel insurance", "ck_insurance_hint": "Check whether it is required for your trip", "ck_baggage": "Pack your bags", "ck_baggage_hint_unknown": "Confirm your allowance with your airline first", "ck_arrivalTime": "Plan when to reach the airport", "ck_arrivalTime_hint": "Ask your airline when check-in closes", "rqDisclaimer": "SafarCare doesn't decide whether you need a visa. Check each item with the embassy, the immigration authority or your airline.", "rq_passport_title": "Passport validity", "rq_passport_noDate": "Add your passport's expiry date to see how long it stays valid after your trip. Ask the embassy how long it must be valid.", "rq_passport_expires": "Your passport expires on {date}. Ask the embassy how long it must be valid.", "rq_passport_months": "Your passport expires on {date} — about {n} month(s) after your trip ends. Ask the embassy how long it must be valid.", "rq_passport_beforeEnd": "Your passport expires on {date}, before this trip ends. Contact your passport office.", "rq_passport_general": "Check when your passport expires. Many countries ask that it stays valid for some time after you arrive — the embassy can tell you how long.", "rq_visa_title": "Visa requirements", "rq_visa_body": "Check with the embassy or immigration authority of {place} whether you need a visa for this trip, and how to apply.", "rq_visa_general": "Check with the embassy or immigration authority of the country you are going to. Rules depend on your passport and the reason for your trip.", "rq_transit_title": "Transit documents", "rq_transit_body": "You change planes in {place}. Ask your airline or the embassy whether you need any documents for this connection.", "rq_transit_general": "If you change planes on the way, ask your airline whether you need any documents for the connection.", "rq_other_title": "Insurance and other documents", "rq_other_body": "Check whether travel insurance, a hotel booking, a return ticket, an invitation letter or a vaccination card will be asked for.", "rqAddExpiry": "Add expiry date", "rqChangeExpiry": "Change expiry date", "rqNote": "Your note", "rqAddNote": "Add a note", "rqEditNote": "Edit note", "rqMarkChecked": "Mark as checked: {item}", "rqMarkUnchecked": "Mark as not checked: {item}", "rqMyItems": "My own items", "rqMyItemsHint": "Your own items also appear in this trip's Travel Checklist.", "rqScanForTrip": "Scan a ticket for trip reminders", "guideIntro": "Your first international flight? Here is what happens at the airport, step by step.", "guideDeparting": "Leaving", "guideConnecting": "Changing planes", "guideArriving": "Arriving", "guideNext": "Next: {step}", "g_checkin_title": "Check-in and bag drop", "g_checkin_intro": "Check-in is where the airline confirms your seat and takes your big bags.", "g_checkin_s1": "Find your airline's name on the screens in the departure hall. They show which counter to go to.", "g_checkin_s2": "Give your passport and ticket (on paper or on your phone) to the airline staff.", "g_checkin_s3": "Put your checked bags on the scale. Keep money, medicine, documents and valuables in your hand luggage.", "g_checkin_s4": "You get a boarding pass and a baggage tag receipt. Keep both safe until you collect your bags.", "g_security_title": "Security screening", "g_security_intro": "Security checks that nothing dangerous is taken on the plane.", "g_security_s1": "Have your boarding pass ready. Put your bag, jacket, belt, phone and metal items in a tray.", "g_security_s2": "Liquids in your hand luggage must usually be in small bottles inside a clear bag. Big bottles are taken away.", "g_security_s3": "Walk through the scanner when the officer asks you. If it beeps, an officer may check you by hand.", "g_security_s4": "Collect all your things from the trays before you walk on.", "g_exitImmigration_title": "Passport control (leaving)", "g_exitImmigration_intro": "An officer checks your passport before you leave the country.", "g_exitImmigration_s1": "Join the queue and wait behind the line until you are called.", "g_exitImmigration_s2": "Give your passport and boarding pass. Answer questions calmly and simply.", "g_exitImmigration_s3": "The officer may stamp your passport. Check that you get it back.", "g_exitImmigration_s4": "You are now in the departure area. Do not leave it.", "g_gates_title": "Finding your gate", "g_gates_intro": "The gate is the door where you get on the plane. Its number is on your boarding pass and on the screens.", "g_gates_s1": "Look at the departure screens for your flight number. They show the gate and the boarding time.", "g_gates_s2": "Gates can change. Check the screens again and listen for announcements.", "g_gates_s3": "Go to your gate early. Some gates are a long walk away.", "g_gates_s4": "If you are lost, show your boarding pass to any airport staff member and ask.", "g_boarding_title": "Boarding the plane", "g_boarding_intro": "Boarding is when passengers get on the plane, usually in groups.", "g_boarding_s1": "Boarding often starts 30–60 minutes before departure. Be at the gate by the time on your boarding pass.", "g_boarding_s2": "Wait until your group or seat row is called.", "g_boarding_s3": "Show your boarding pass and passport. Staff scan your boarding pass.", "g_boarding_s4": "Find your seat number on the boarding pass. Cabin crew will help you.", "g_transit_title": "Changing planes (transit)", "g_transit_intro": "If you have a connecting flight, follow the transit signs — usually you don't go out of the airport.", "g_transit_s1": "When you get off the plane, look for signs that say \"Transfer\", \"Transit\" or \"Connecting flights\".", "g_transit_s2": "Check the screens for your next flight's gate. You may go through security again.", "g_transit_s3": "Ask your airline before you travel whether your bags go straight to your final airport, or whether you must collect them.", "g_transit_s4": "If you are worried about time, show your boarding pass to transfer staff and ask for help.", "g_arrivalImmigration_title": "Passport control (arriving)", "g_arrivalImmigration_intro": "When you land, an officer decides whether you can enter the country.", "g_arrivalImmigration_s1": "Follow the \"Arrivals\" or \"Immigration\" signs. Some countries have separate queues for citizens and visitors.", "g_arrivalImmigration_s2": "Have your passport, visa (if you need one) and any documents ready, such as a hotel booking or invitation letter.", "g_arrivalImmigration_s3": "Answer questions honestly: why you are visiting, how long you will stay, and where you will stay.", "g_arrivalImmigration_s4": "You may need to fill in an arrival card. Ask cabin crew for one on the plane.", "g_baggageClaim_title": "Collecting your bags", "g_baggageClaim_intro": "Your checked bags come out on a moving belt in the baggage hall.", "g_baggageClaim_s1": "Find your flight number on the screens. They show which belt your bags will come on.", "g_baggageClaim_s2": "Check the tag on your bag matches your baggage receipt. Many bags look alike.", "g_baggageClaim_s3": "If your bag doesn't arrive, go to the baggage service desk before you leave the hall. Show your receipt.", "g_baggageClaim_s4": "You may pass through customs. Follow the green line if you have nothing to declare, or the red line if you do.", "tip1_title": "Keep copies of your documents", "tip1_body": "Save photos of your passport, visa and ticket, and carry a paper copy apart from the originals.", "tip2_title": "Get to the airport early", "tip2_body": "International check-in can close an hour or more before departure. Ask your airline for the exact time.", "tip3_title": "Weigh your bags at home", "tip3_body": "Extra weight at the airport can be expensive. Check your allowance in SafarCare and weigh your bags before you leave.", "tip4_title": "Know what not to pack", "tip4_body": "Sharp items and large liquids can't go in hand luggage. Batteries and power banks must go in hand luggage, not checked bags.", "tip5_title": "Charge your phone", "tip5_body": "Your boarding pass may be on your phone. Charge it fully and carry a charger.", "tip6_title": "Carry some money", "tip6_body": "Have a small amount of money for transit airports. Not every place accepts the same cards.", "tip7_title": "Medicine in hand luggage", "tip7_body": "Keep medicine you need in your hand luggage with the prescription or a doctor's letter.", "tip8_title": "Ask for help", "tip8_body": "Airline and airport staff help travellers every day. Show your boarding pass and ask — it is normal.", "settings": "Settings", "sectionPreferences": "Preferences", "sectionAccount": "Account", "sectionAbout": "About", "language": "Language", "appearance": "Appearance", "themeSystem": "Same as phone", "themeLight": "Light", "themeDark": "Dark", "english": "English", "somali": "Soomaali", "arabic": "العربية", "notifications": "Trip reminders", "notifSettingHint": "A reminder one week and one day before you fly", "notifDenied": "Notifications are off for SafarCare. You can allow them in your phone settings.", "notifChannel": "Trip reminders", "notifChannelDesc": "Reminders before your flights", "notifWeekTitle": "One week until {route}", "notifWeekBody": "Check your travel requirements: passport, visa and transit documents.", "notifD ta shandad.", "cabinMeaningNone": "Tigidhkani ma muujinayo shandad gacan. Weydii shirkadda diyaaradda waxa aad la geli karto diyaaradda.", "cabinMeaningPiecesKg": "Waxaad diyaaradda la geli kartaa {n} shandad. Mid kasta waa inuu ahaadaa {kg} kg ama ka yar.", "cabinMeaningPieces": "Waxaad diyaaradda la geli kartaa {n} shandad. Miisaanka kuma qorna tigidhkan — weydii shirkadda diyaaradda.", "cabinMeaningTotal": "Shandadda aad diyaaradda la gasho waxay noqon kartaa ilaa {kg} kg.", "bagSourceTicket": "Waxaa laga akhriyay tigidhkaaga sida “{raw}”", "bagSourceManual": "Adiga ayaa qoray", "bagSourceSmart": "Akhriska Casriga ah ayaa helay (“{raw}”) — fadlan hubi", "bagManualHelp": "Qor waxa shirkadda diyaaraddu kuu sheegtay ama waxa ku qoran tigidhkaaga. Sanduuq banaan u daa haddii aadan garanayn.", "bagPiecesLabel": "Tirada shandadaha", "bagKgPerPieceLabel": "Kg shandad kasta", "bagTotalKgLabel": "Wadarta kg (haddii tigidhku muujiyo wadar)", "bcNoTripTitle": "Weli tigidh ma jiro", "bcNoTripBody": "Iskaan garee tigidhkaaga si aad u aragto xaddiga shandadahaaga. Tigidh kasta wuu ka duwanaan karaa, xitaa isla shirkad.", "bcCodesTitle": "Waxa koodhadka tigidhada ku qoran ay ka dhigan yihiin", "bcCodePc": "PC waa gabal (shandad). 2PC = waxaad dhiibi kartaa 2 shandad.", "bcCodeKg": "KG kaligeed waa miisaan wadar ah. 30KG = shandadahaaga la dhiibo oo dhan ilaa 30 kg.", "bcCodePcKg": "Shandado iyo miisaan wadajir: 2 shandad, mid kasta ilaa 23 kg.", "bcCodeNil": "Shandad la dhiibo kuma jirto.", "bcCabinNote": "Xeerarka shandadda gacanta (cabbirka iyo miisaanka) badanaa si gooni ah ayaa loo qoraa. Haddii aadan helin, weydii shirkadda diyaaradda.", "bcDisclaimer": "Xaddigu wuxuu ku xiran yahay shirkadda, wadada, qiimaha iyo tigidhkaaga. Had iyo jeer ka hubi shirkadda diyaaradda haddii aadan hubin.", "tripsEmptyTitle": "Weli safar ma jiro", "tripsEmptyBody": "Iskaan garee tigidh oo kaydi. Safarradaada halkan ayay ka muuqan doonaan.", "tripsUpcoming": "Soo socda", "tripsPast": "Safarradii hore", "tripsLoadError": "Safarradaada lama soo kicin karin. Fadlan isku day mar kale.", "tripNotFound": "Safarkan hadda ma jiro", "viaStops": "iyadoo maraysa {stops}", "toCheck": "{n} in la hubiyo", "bookingTitle": "Faahfaahinta ballanta", "viewTicket": "Eeg tigidhka", "ticketOpenFailed": "Faylka tigidhkan lama furi karin", "tripCheckAirline": "Saacadaha iyo albaabada way isbeddeli karaan. Ka hubi shirkadda diyaaradda maalinta aad safrayso.", "tripDelete": "Tirtir safarka", "tripDeleteTitle": "Ma tirtirtaa safarkan?", "tripDeleteBody": "Safarka, liiskiisa iyo faylka tigidhka la kaydiyay waa laga tirtiri doonaa taleefankan iyo kaydkaaga.", "ckDisclaimer": "Kuwani waa xusuusin kaa caawinaya inaad diyaargarowdo — ma aha shuruud rasmi ah. Ka saar wixii aan ku khusayn.", "ckProgress": "{done} ka mid ah {total} waa diyaar", "ckAdd": "Ku dar shay adiga kuu gaar ah", "ckAddHint": "Tusaale: Koobiga baasaboorka", "ckEdit": "Wax ka beddel", "ck_passport": "Baasaboor", "ck_passport_hint": "Haysto oo hubi taariikhda uu dhacayo", "ck_ticket": "Tigidhka duulimaadka", "ck_ticket_hint": "Waxaa lagu kaydiyay SafarCare", "ck_visaCheck": "Shuruudaha fiisaha", "ck_visaCheck_hint": "Ka hubi safaaradda ama hay'adda socdaalka ee {place}", "ck_transitDocuments": "Dukumentiyada transit-ka", "ck_transitDocuments_hint": "Weydii shirkadda diyaaradda waxa aad u baahan tahay si aad diyaarad ugu beddesho {stops}", "ck_hotel": "Ballanta hoteelka ama cinwaanka", "ck_hotel_hint": "Haddii aad leedahay, koobi haysto", "ck_returnTicket": "Tigidhka soo noqoshada ama sii socoshada", "ck_returnTicket_hint": "Hubi in lagaa weydiin doono", "ck_insurance": "Caymiska safarka", "ck_insurance_hint": "Hubi in safarkaagu u baahan yahay", "ck_baggage": "Diyaari shandadahaaga", "ck_baggage_hint_unknown": "Marka hore ka xaqiiji xaddiga shirkadda diyaaradda", "ck_arrivalTime": "Qorshee goorta aad garoonka gaadhayso", "ck_arrivalTime_hint": "Weydii shirkadda diyaaradda goorta check-in-ku xidhmayo", "rqDisclaimer": "SafarCare ma go'aamiso inaad fiiso u baahan tahay iyo in kale. Shay kasta ka hubi safaaradda, hay'adda socdaalka ama shirkadda diyaaradda.", "rq_passport_title": "Ansaxnimada baasaboorka", "rq_passport_noDate": "Ku dar taariikhda baasaboorkaagu dhacayo si aad u aragto inta uu ansax yahay safarka kadib. Weydii safaaradda inta uu waa inuu ansax ahaadaa.", "rq_passport_expires": "Baasaboorkaagu wuxuu dhacayaa {date}. Weydii safaaradda inta uu waa inuu ansax ahaadaa.", "rq_passport_months": "Baasaboorkaagu wuxuu dhacayaa {date} — qiyaastii {n} bilood kadib marka safarkaagu dhammaado. Weydii safaaradda inta uu waa inuu ansax ahaadaa.", "rq_passport_beforeEnd": "Baasaboorkaagu wuxuu dhacayaa {date}, ka hor inta safarkani dhammaan. La xiriir xafiiska baasaboorka.", "rq_passport_general": "Hubi goorta baasaboorkaagu dhacayo. Dalal badan waxay rabaan inuu ansax ahaado muddo kadib markaad gaadho — safaaraddu way kuu sheegi kartaa inta.", "rq_visa_title": "Shuruudaha fiisaha", "rq_visa_body": "Ka hubi safaaradda ama hay'adda socdaalka ee {place} inaad u baahan tahay fiiso safarkan iyo sida loo codsado.", "rq_visa_general": "Ka hubi safaaradda ama hay'adda socdaalka ee dalka aad u socoto. Xeerarku waxay ku xiran yihiin baasaboorkaaga iyo sababta safarka.", "rq_transit_title": "Dukumentiyada transit-ka", "rq_transit_body": "Waxaad diyaarad ku beddelaysaa {place}. Weydii shirkadda diyaaradda ama safaaradda inaad u baahan tahay dukumenti xiriirkan.", "rq_transit_general": "Haddii aad jidka diyaarad ku beddelayso, weydii shirkadda diyaaradda inaad u baahan tahay dukumenti xiriirka.", "rq_other_title": "Caymiska iyo dukumentiyo kale", "rq_other_body": "Hubi in lagaa weydiin doono caymis safar, ballan hoteel, tigidh soo noqosho, warqad casuumaad ama kaarka tallaalka.", "rqAddExpiry": "Ku dar taariikhda dhicitaanka", "rqChangeExpiry": "Beddel taariikhda dhicitaanka", "rqNote": "Qoraalkaaga", "rqAddNote": "Ku dar qoraal", "rqEditNote": "Wax ka beddel qoraalka", "rqMarkChecked": "Calaamadee waa la hubiyay: {item}", "rqMarkUnchecked": "Calaamadee lama hubin: {item}", "rqMyItems": "Waxyaabahayga gaarka ah", "rqMyItemsHint": "Waxyaabahaaga gaarka ah sidoo kale waxay ka muuqdaan Liiska safarka ee safarkan.", "rqScanForTrip": "Iskaan garee tigidh si aad u hesho xusuusinta safarka", "guideIntro": "Ma duulimaadkaagii ugu horreeyay ee caalami ah baa? Waa kan waxa garoonka ka dhaca, tallaabo tallaabo.", "guideDeparting": "Ka ambabaxa", "guideConnecting": "Beddelka diyaaradda", "guideArriving": "Gaadhista", "guideNext": "Xiga: {step}", "g_checkin_title": "Check-in iyo dhiibista shandadaha", "g_checkin_intro": "Check-in waa meesha shirkaddu ku xaqiijiso kursigaaga oo ay kaa qaadato shandadaha waaweyn.", "g_checkin_s1": "Ka raadi magaca shirkaddaada shaashadaha hoolka ambabaxa. Waxay muujiyaan miiska aad aadayso.", "g_checkin_s2": "Sii shaqaalaha shirkadda baasaboorkaaga iyo tigidhkaaga (warqad ama taleefan).", "g_checkin_s3": "Shandadaha la dhiibo saar miisaanka. Lacagta, daawada, dukumentiyada iyo waxyaabaha qaaliga ah ku hay shandadda gacanta.", "g_checkin_s4": "Waxaad heli doontaa boarding pass iyo rasiidka shandadaha. Labadaba si fiican u hay ilaa aad shandadahaaga ka qaadato.", "g_security_title": "Baaritaanka amniga", "g_security_intro": "Amnigu wuxuu hubiyaa in wax khatar ah aan diyaaradda la gelin.", "g_security_s1": "Diyaarso boarding pass-kaaga. Shandaddaada, jaakadda, suunka, taleefanka iyo biraha ku rid saxanka.", "g_security_s2": "Dareerayaasha shandadda gacanta badanaa waa inay ku jiraan dhalooyin yaryar oo ku jira bac cad. Dhalooyinka waaweyn waa laga qaadaa.", "g_security_s3": "Ka gudub iskaanka marka sarkaalku kuu sheego. Haddii uu dhawaaq sameeyo, sarkaal ayaa gacanta kaa baari kara.", "g_security_s4": "Ka soo qaado wixii aad lahayd oo dhan saxamada ka hor intaadan socon.", "g_exitImmigration_title": "Hubinta baasaboorka (ka bixitaanka)", "g_exitImmigration_intro": "Sarkaal ayaa hubiya baasaboorkaaga ka hor intaadan dalka ka bixin.", "g_exitImmigration_s1": "Saf gal oo ka sug xariiqda gadaasheeda ilaa lagu yeedho.", "g_exitImmigration_s2": "Sii baasaboorkaaga iyo boarding pass-ka. Su'aalaha si deggan oo fudud uga jawaab.", "g_exitImmigration_s3": "Sarkaalku wuxuu shaabad ku dhufan karaa baasaboorkaaga. Hubi in lagu soo celiyo.", "g_exitImmigration_s4": "Hadda waxaad joogtaa aagga ambabaxa. Ha ka bixin.", "g_gates_title": "Helitaanka albaabkaaga", "g_gates_intro": "Albaabku waa meesha laga fuulo diyaaradda. Lambarkiisu wuxuu ku qoran yahay boarding pass-ka iyo shaashadaha.", "g_gates_s1": "Shaashadaha ambabaxa ka eeg lambarka duulimaadkaaga. Waxay muujiyaan albaabka iyo waqtiga fuulista.", "g_gates_s2": "Albaabadu way isbeddeli karaan. Mar kale eeg shaashadaha oo dhegeyso ogeysiisyada.", "g_gates_s3": "Goor hore u tag albaabkaaga. Albaabada qaar way fog yihiin.", "g_gates_s4": "Haddii aad lumto, tus boarding pass-kaaga shaqaale kasta oo garoonka ah oo weydii.", "g_boarding_title": "Fuulista diyaaradda", "g_boarding_intro": "Fuulistu waa marka rakaabku diyaaradda galaan, badanaa koox koox.", "g_boarding_s1": "Fuulistu badanaa waxay bilaabataa 30–60 daqiiqo ka hor ambabaxa. Albaabka joog waqtiga ku qoran boarding pass-ka.", "g_boarding_s2": "Sug ilaa kooxdaada ama safka kursigaaga lagu yeedho.", "g_boarding_s3": "Tus boarding pass-ka iyo baasaboorka. Shaqaaluhu waxay iskaan gareeyaan boarding pass-kaaga.", "g_boarding_s4": "Lambarka kursigaaga ka hel boarding pass-ka. Shaqaalaha diyaaradda ayaa ku caawin doona.", "g_transit_title": "Beddelka diyaaradda (transit)", "g_transit_intro": "Haddii aad leedahay duulimaad xiriir ah, raac calaamadaha transit-ka — badanaa garoonka kama baxdid.", "g_transit_s1": "Markaad diyaaradda ka degto, raadi calaamadaha \"Transfer\", \"Transit\" ama \"Connecting flights\".", "g_transit_s2": "Shaashadaha ka eeg albaabka duulimaadkaaga xiga. Mar kale ayaa laga yaabaa inaad amniga marto.", "g_transit_s3": "Ka hor safarka weydii shirkadda in shandadahaagu toos u aadayaan garoonkaaga ugu dambeeya, ama waa inaad soo qaadato.", "g_transit_s4": "Haddii waqtigu kaa walwal geliyo, tus boarding pass-ka shaqaalaha transfer-ka oo caawimaad weydii.", "g_arrivalImmigration_title": "Hubinta baasaboorka (gaadhista)", "g_arrivalImmigration_intro": "Markaad dagto, sarkaal ayaa go'aamiya inaad dalka geli karto.", "g_arrivalImmigration_s1": "Raac calaamadaha \"Arrivals\" ama \"Immigration\". Dalal qaar waxay leeyihiin saf gooni ah muwaadiniinta iyo booqdayaasha.", "g_arrivalImmigration_s2": "Diyaarso baasaboorkaaga, fiisaha (haddii aad u baahan tahay) iyo dukumentiyada sida ballanta hoteelka ama warqadda casuumaadda.", "g_arrivalImmigration_s3": "Si daacad ah uga jawaab su'aalaha: sababta booqashadaada, inta aad joogayso, iyo meesha aad degayso.", "g_arrivalImmigration_s4": "Waxaa laga yaabaa inaad buuxiso kaarka gaadhista. Ka weydii shaqaalaha diyaaradda.", "g_baggageClaim_title": "Qaadashada shandadahaaga", "g_baggageClaim_intro": "Shandadahaaga la dhiibay waxay ku soo baxaan suun socda oo ku yaal hoolka shandadaha.", "g_baggageClaim_s1": "Shaashadaha ka hel lambarka duulimaadkaaga. Waxay muujiyaan suunka shandadahaagu ku iman doonaan.", "g_baggageClaim_s2": "Hubi in calaamadda shandaddaadu la mid tahay rasiidkaaga. Shandado badan way isu eg yihiin.", "g_baggageClaim_s3": "Haddii shandaddaadu iman weydo, tag miiska adeegga shandadaha ka hor intaadan hoolka ka bixin. Tus rasiidkaaga.", "g_baggageClaim_s4": "Waxaa laga yaabaa inaad marto kastamka. Raac khadka cagaaran haddii aadan wax sheegid lahayn, ama khadka casaan haddii aad leedahay.", "tip1_title": "Haysto koobiyada dukumentiyadaada", "tip1_body": "Kaydi sawirrada baasaboorkaaga, fiisaha iyo tigidhka, oo koobi warqad ah ka fogee kuwa asalka ah.", "tip2_title": "Goor hore garoonka tag", "tip2_body": "Check-in-ka caalamiga ah wuxuu xidhmi karaa saacad ama ka badan ka hor ambabaxa. Weydii shirkadda waqtiga saxda ah.", "tip3_title": "Guriga ku miisaan shandadahaaga", "tip3_body": "Miisaan dheeraad ah garoonka qaali ayuu noqon karaa. Ka eeg xaddigaaga SafarCare oo miisaan shandadaha ka hor intaadan bixin.", "tip4_title": "Ogow waxa aan la xirxiran", "tip4_body": "Alaabta afka leh iyo dareerayaasha waaweyn lama gelin karo shandadda gacanta. Baytariyada iyo power bank-ku waa inay ku jiraan shandadda gacanta, ma aha kuwa la dhiibo.", "tip5_title": "Dallac taleefankaaga", "tip5_body": "Boarding pass-kaagu wuxuu ku jiri karaa taleefankaaga. Si buuxda u dallac oo charger qaado.", "tip6_title": "Lacag yar qaado", "tip6_body": "Haysato lacag yar garoomada transit-ka. Meel kasta ma aqbasho kaararka isku midka ah.", "tip7_title": "Daawada shandadda gacanta", "tip7_body": "Daawada aad u baahan tahay ku hay shandadda gacanta, iyadoo ay la socoto warqadda dhakhtarka.", "tip8_title": "Caawimaad weydii", "tip8_body": "Shaqaalaha shirkadda iyo garoonka maalin kasta ayay caawiyaan musaafiriinta. Tus boarding pass-kaaga oo weydii — waa caadi.", "settings": "Dejinta", "sectionPreferences": "Doorashooyinka", "sectionAccount": "Akoonka", "sectionAbout": "Ku saabsan", "language": "Luqadda", "appearance": "Muuqaalka", "themeSystem": "Sida taleefanka", "themeLight": "Iftiin", "themeDark": "Mugdi", "english": "English", "somali": "Soomaali", "arabic": "العربية", "notifications": "Xusuusinta safarka", "notifSettingHint": "Xusuusin hal toddobaad iyo hal maalin ka hor duulimaadkaaga", "notifDenied": "Ogeysiisyada SafarCare way xiran yihiin. Waxaad ka oggolaan kartaa dejinta taleefankaaga.", "notifChannel": "Xusuusinta safarka", "notifChannelDesc": "Xusuusin ka hor duulimaadyadaada", "notifWeekTitle": "Hal toddobaad ka hor {route}", "notifWeekBody": "Hubi shuruudaha safarkaaga: baasaboorka, fiisaha iyo dukumentiyada transit-ka.", "notifDayTitle": "Berri: {route}", "notifDayBody": "Diyaarso dukumentiyadaada oo hubi goorta check-in-ku xidhmayo.", "privacy": "Ilaalinta xogta", "signIn": "Gal ama samee akoon", "signInOptional": "Ikhtiyaari — kaydi safarradaada", "deleteAccount": "Tirtir akoonka", "aboutSafarCare": "Ku saabsan SafarCare", "aboutBody": "SafarCare waxay musaafiriinta ka caawisaa inay fahmaan duulimaadkooda, shandadahooda, dukumentiyadooda iyo tallaabooyinka garoonka. Waa hage kaliya — had iyo jeer xaqiiji xogta muhiimka ah shirkadda diyaaradda ama safaaradda khuseysa.", "helpSupport": "Caawimaad iyo taageero", "terms": "Shuruudaha iyo xaaladaha", "version": "Nooca", "account": "Akoonka", "accountsOffTitle": "Akoonnada weli lama heli karo", "accountsOffBody": "Noocan SafarCare kuma xirna adeegga akoonnada. Qalab kasta oo safar wuu shaqeeyaa, safarradaaduna waxay ku kaydsan yihiin taleefankan.", "authSignInTitle": "Gal", "authCreateTitle": "Samee akoonkaaga", "authWhy": "Akoonku waa ikhtiyaari. Wuxuu kaydiyaa safarradaada si aad ugu soo celiso taleefan cusub.", "authName": "Magacaaga", "authNameRequired": "Fadlan qor magacaaga", "authEmail": "Iimayl", "authPassword": "Erey sireed", "authPasswordHelp": "Ugu yaraan 8 xaraf", "authPasswordAgain": "Mar kale qor ereyga sirta", "authShowPassword": "Muuji ereyga sirta", "authHidePassword": "Qari ereyga sirta", "authSignInButton": "Gal", "authCreateButton": "Samee akoon", "authForgot": "Ma ilowday ereyga sirta?", "authNoAccount": "Cusub? Samee akoon", "authHaveAccount": "Akoon ma leedahay? Gal", "authResetSent": "Waxaan kuu dirnay xiriiriye aad ku beddesho ereyga sirta. Hubi iimaylkaaga.", "authResetNeedsEmail": "Marka hore qor iimaylkaaga, kadibna riix \"Ma ilowday ereyga sirta?\".", "authPrivacyNote": "Ereyga sirtaadu wuxuu si toos ah u aadaa adeegga galitaanka ee aaminka ah. SafarCare marnaba ma arkto mana kaydiso.", "authEditName": "Beddel magaca", "authErrEmail": "Fadlan qor iimayl sax ah", "authErrWeak": "Ereyga sirtu wuxuu u baahan yahay ugu yaraan 8 xaraf", "authErrCredentials": "Iimaylka ama ereyga sirtu waa khalad", "authErrInUse": "Iimaylkan akoon horey ayuu u leeyahay. Isku day inaad gasho.", "authErrDisabled": "Akoonkan waa la damiyay. La xiriir taageerada.", "authErrTooMany": "Isku day badan. Fadlan sug dhowr daqiiqo oo mar kale isku day.", "authErrRecentLogin": "Badbaadadaada awgeed, fadlan marka hore mar kale gal.", "authErrGeneric": "Wax baa khaldamay. Fadlan isku day mar kale.", "verifyTitle": "Hubi iimaylkaaga", "verifyBody": "Waxaan xiriiriye u dirnay {email}. Riix si aad u xaqiijiso iimaylkaaga, kadib halkan ku soo noqo.", "verifyDone": "Waan xaqiijiyay iimaylkayga", "verifyNotYet": "Weli lama xaqiijin. Riix xiriiriyaha iimaylka, kadib mar kale isku day.", "verifyResend": "Mar kale dir iimaylka", "verifyResent": "Iimaylka mar kale ayaa la diray", "signOut": "Ka bax", "backupOn": "Xogta safarradaada waa la kaydiyay. Faylasha tigidhka iyo taariikhda baasaboorkaagu waxay ku jiraan taleefankan kaliya.", "deleteAccountTitle": "Ma tirtirtaa akoonkaaga?", "deleteAccountBody": "Akoonkaaga, safarradaada la kaydiyay iyo safarrada iyo tigidhada taleefankan ku jira waa la tirtiri doonaa. Tan dib looma celin karo.", "deleteForever": "Tirtir weligeed", "accountDeleted": "Akoonkaaga waa la tirtiray", "pv_read_title": "Tigidhkaaga waxaa lagu akhriyaa taleefankaaga", "pv_read_body": "Sawirrada iyo PDF-yada waxaa lagu akhriyaa taleefankan. Looma diro meel kale si loo akhriyo.", "pv_store_title": "Safarrada la kaydiyay waa qarsoon yihiin", "pv_store_body": "Safarrada iyo faylasha tigidhka aad kaydiso waa la qarsoodiyaa taleefankan. Furaha waxaa lagu hayaa kaydka aaminka ah ee taleefankaaga.", "pv_cloud_title": "Kaydku waa ikhtiyaari", "pv_cloud_body": "Haddii aad akoon samayso, xogta safarradaada waa la kaydiyaa si adiga kaliya aad u aragto. Faylasha tigidhka iyo taariikhda baasaboorka marnaba lama diro.", "pv_smart_title": "Akhriska Casriga ah kaliya markaad codsato", "pv_smart_body": "Haddii aad riixdo Akhriska Casriga ah, kaliya qoraalka tigidhka ayaa loo diraa adeeggayaga aaminka ah si loo helo xogta maqan. Halkaas laguma kaydiyo.", "pv_share_title": "Marnaba lama wadaago", "pv_share_body": "Dukumentiyadaada marnaba laguma tuso isticmaaleyaal kale, lama iibiyo, xayeysiisna looma isticmaalo. SafarCare xayeysiis ma leh.", "pv_delete_title": "Tirtir goor kasta", "pv_delete_body": "Ka tirtir hal safar boggiisa, wax kasta oo taleefankan ku jira hoos, ama akoonkaaga dejinta Akoonka.", "pvDeleteAll": "Tirtir dhammaan xogta taleefankan", "pvDeleteAllTitle": "Ma tirtirtaa wax kasta oo taleefankan ku jira?", "pvDeleteAllBody": "Dhammaan safarrada, liisaska iyo faylasha tigidhka ee taleefankan ku kaydsan waa la tirtiri doonaa. Kaydka akoonkaaga (haddii uu jiro) wax kama gaadhayo.", "pvDeleted": "Dhammaan xogta taleefankan waa la tirtiray", "faq1_q": "SafarCare ma bilaash baa?", "faq1_a": "Haa. SafarCare waa bilaash, xayeysiisna ma leh.", "faq2_q": "Maxay u leedahay \"Lama helin\"?", "faq2_a": "Tigidhada qaar ma muujiyaan xog kasta, ama sawirku ma cadda. SafarCare marnaba ma qiyaasto. Riix meesha si aad adigu u qorto, ama weydii shirkadda diyaaradda.", "faq3_q": "SafarCare ma ii sheegi kartaa inaan fiiso u baahanahay?", "faq3_a": "Maya. Xeerarka fiisaha waxay ku xiran yihiin baasaboorkaaga oo si joogto ah ayay isu beddelaan, sidaa darteed SafarCare waxay kuu xusuusinaysaa inaad ka hubiso safaaradda ama hay'adda socdaalka.", "faq4_q": "Ma u baahanahay akoon?", "faq4_a": "Maya. Qalab kasta wuu shaqeeyaa la'aantiis. Akoonku kaliya wuxuu kaydiyaa safarradaada.", "faq5_q": "Xaddiga shandadahaygu wuxuu u eg yahay khalad", "faq5_a": "Ku riix bogga safarkaaga si aad u saxdo. Shirkadda diyaaradda ayaa leh go'aanka ugu dambeeya ee xaddigaaga.", "helpContact": "Caawimaad dheeraad ah? Iimayl u dir {email}", "tm1_title": "Hage kaliya", "tm1_body": "SafarCare waxay kaa caawisaa inaad fahamto safarkaaga. Ma aha shirkad diyaaradeed, wakiil safar ama adeeg dowladeed.", "tm2_title": "Hubi xogta muhiimka ah", "tm2_body": "Had iyo jeer ka xaqiiji duulimaadyada, shandadaha, fiisaha iyo dukumentiyada shirkadda diyaaradda iyo hay'adaha khuseeya. Gelitaanka dal kasta waxaa go'aamiya saraakiishiisa.", "tm3_title": "Waajibaadkaaga", "tm3_body": "Kaliya iskaan garee tigidhada adiga kuu gaar ah ama aad ogolaansho u haysato. Xogta akoonkaaga si aamin ah u hay.", "tm4_title": "Xogtaada", "tm4_body": "Sida dukumentiyadaada loo akhriyo loona kaydiyo waxaa lagu sharxay Ilaalinta xogta. Xogtaada waad tirtiri kartaa goor kasta.", "tm5_title": "Isbeddello", "tm5_body": "Waxaan cusboonaysiin karnaa app-ka iyo shuruudahan. Haddii wax muhiim ahi isbeddelaan, waxaan kuugu sheegi doonaa app-ka gudihiisa."}, "ar": {"appName": "SafarCare", "tagline": "سافر مستعدًا. سافر بثقة.", "greetingMorning": "صباح الخير", "greetingAfternoon": "مساء الخير", "greetingEvening": "مساء الخير", "guestName": "مسافر", "profile": "الملف الشخصي", "notFound": "غير موجود", "cancel": "إلغاء", "done": "تم", "delete": "حذف", "moreOptions": "خيارات أخرى", "leaveEmptyIfUnknown": "اتركه فارغًا إن كنت لا تعرف", "errNoInternet": "لا يوجد اتصال بالإنترنت. تحقّق من الاتصال وحاول مرة أخرى.", "month1": "يناير", "month2": "فبراير", "month3": "مارس", "month4": "أبريل", "month5": "مايو", "month6": "يونيو", "month7": "يوليو", "month8": "أغسطس", "month9": "سبتمبر", "month10": "أكتوبر", "month11": "نوفمبر", "month12": "ديسمبر", "weekday1": "الإثنين", "weekday2": "الثلاثاء", "weekday3": "الأربعاء", "weekday4": "الخميس", "weekday5": "الجمعة", "weekday6": "السبت", "weekday7": "الأحد", "scanEyebrow": "الماسح الذكي للتذاكر", "scanTitle": "افهم تذكرتك في ثوانٍ", "scanBody": "لقطة شاشة أو صورة أو ملف PDF أو صورة من واتساب — نقرأ لك تفاصيل الرحلة والأمتعة.", "scanButton": "امسح تذكرتي", "upcomingJourney": "رحلتك القادمة", "viewTrip": "عرض الرحلة", "noTripTitle": "لا توجد رحلة قادمة بعد", "noTripBody": "امسح تذكرتك وستظهر رحلتك القادمة هنا.", "myTrips": "رحلاتي", "travelRequirements": "متطلبات السفر", "baggageChecker": "فحص الأمتعة", "travelChecklist": "قائمة السفر", "airportGuide": "دليل المطار", "travelTips": "نصائح السفر", "navHome": "الرئيسية", "navTrips": "الرحلات", "navScan": "امسح التذكرة", "navRequirements": "التذكيرات", "navSettings": "الإعدادات", "scanAddTitle": "أضف تذكرتك", : "تعديل العنصر", "ck_passport": "جواز السفر", "ck_passport_hint": "احمله معك وتحقّق من تاريخ انتهائه", "ck_ticket": "تذكرة الطيران", "ck_ticket_hint": "محفوظة في SafarCare", "ck_visaCheck": "متطلبات التأشيرة", "ck_visaCheck_hint": "تحقّق من السفارة أو سلطة الهجرة الخاصة بـ {place}", "ck_transitDocuments": "وثائق العبور", "ck_transitDocuments_hint": "اسأل شركة الطيران عمّا تحتاجه لتغيير الطائرة في {stops}", "ck_hotel": "حجز الفندق أو العنوان", "ck_hotel_hint": "إن كان لديك حجز فاحتفظ بنسخة منه", "ck_returnTicket": "تذكرة العودة أو المتابعة", "ck_returnTicket_hint": "تحقّق إن كانت ستُطلب منك", "ck_insurance": "تأمين السفر", "ck_insurance_hint": "تحقّق إن كان مطلوبًا لرحلتك", "ck_baggage": "جهّز حقائبك", "ck_baggage_hint_unknown": "أكّد الأمتعة المسموح بها مع شركة الطيران أولًا", "ck_arrivalTime": "خطّط لموعد الوصول إلى المطار", "ck_arrivalTime_hint": "اسأل شركة الطيران متى يُغلق تسجيل الوصول", "rqDisclaimer": "لا يقرّر SafarCare إن كنت تحتاج إلى تأشيرة. تحقّق من كل بند لدى السفارة أو سلطة الهجرة أو شركة الطيران.", "rq_passport_title": "صلاحية جواز السفر", "rq_passport_noDate": "أضف تاريخ انتهاء جواز سفرك لترى كم يبقى صالحًا بعد رحلتك. اسأل السفارة عن المدة المطلوبة.", "rq_passport_expires": "ينتهي جواز سفرك في {date}. اسأل السفارة عن مدة الصلاحية المطلوبة.", "rq_passport_months": "ينتهي جواز سفرك في {date} — بعد نحو {n} شهر/أشهر من نهاية رحلتك. اسأل السفارة عن مدة الصلاحية المطلوبة.", "rq_passport_beforeEnd": "ينتهي جواز سفرك في {date}، قبل نهاية هذه الرحلة. تواصل مع مكتب الجوازات.", "rq_passport_general": "تحقّق من تاريخ انتهاء جواز سفرك. تطلب دول كثيرة أن يبقى صالحًا لمدة بعد الوصول — والسفارة تخبرك بالمدة.", "rq_visa_title": "متطلبات التأشيرة", "rq_visa_body": "تحقّق من سفارة {place} أو سلطة الهجرة فيها إن كنت تحتاج إلى تأشيرة لهذه الرحلة وكيف تتقدّم بطلبها.", "rq_visa_general": "تحقّق من سفارة البلد الذي تسافر إليه أو سلطة الهجرة فيه. تعتمد القواعد على جواز سفرك وسبب رحلتك.", "rq_transit_title": "وثائق العبور", "rq_transit_body": "ستغيّر الطائرة في {place}. اسأل شركة الطيران أو السفارة إن كنت تحتاج إلى وثائق لهذا العبور.", "rq_transit_general": "إن كنت ستغيّر الطائرة في الطريق، فاسأل شركة الطيران إن كنت تحتاج إلى وثائق للعبور.", "rq_other_title": "التأمين ووثائق أخرى", "rq_other_body": "تحقّق إن كان سيُطلب منك تأمين سفر أو حجز فندق أو تذكرة عودة أو خطاب دعوة أو بطاقة تطعيم.", "rqAddExpiry": "أضف تاريخ الانتهاء", "rqChangeExpiry": "غيّر تاريخ الانتهاء", "rqNote": "ملاحظتك", "rqAddNote": "أضف ملاحظة", "rqEditNote": "عدّل الملاحظة", "rqMarkChecked": "وضع علامة تم التحقق: {item}", "rqMarkUnchecked": "إزالة علامة التحقق: {item}", "rqMyItems": "عناصري الخاصة", "rqMyItemsHint": "تظهر عناصرك الخاصة أيضًا في قائمة السفر لهذه الرحلة.", "rqScanForTrip": "امسح تذكرة للحصول على تذكيرات الرحلة", "guideIntro": "أول رحلة دولية لك؟ إليك ما يحدث في المطار خطوة بخطوة.", "guideDeparting": "المغادرة", "guideConnecting": "تغيير الطائرة", "guideArriving": "الوصول", "guideNext": "التالي: {step}", "g_checkin_title": "تسجيل الوصول وتسليم الحقائب", "g_checkin_intro": "عند تسجيل الوصول تؤكّد شركة الطيران مقعدك وتستلم حقائبك الكبيرة.", "g_checkin_s1": "ابحث عن اسم شركة الطيران على الشاشات في صالة المغادرة. ستعرف منها الكاونتر المطلوب.", "g_checkin_s2": "قدّم جواز سفرك وتذكرتك (ورقية أو على الهاتف) لموظف شركة الطيران.", "g_checkin_s3": "ضع حقائبك المسجّلة على الميزان. احتفظ بالمال والأدوية والوثائق والأشياء الثمينة في حقيبة اليد.", "g_checkin_s4": "ستحصل على بطاقة صعود وإيصال للحقائب. احتفظ بهما حتى تستلم حقائبك.", "g_security_title": "التفتيش الأمني", "g_security_intro": "يتأكد التفتيش الأمني من عدم إدخال أي شيء خطير إلى الطائرة.", "g_security_s1": "جهّز بطاقة الصعود. ضع حقيبتك وسترتك وحزامك وهاتفك والأشياء المعدنية في الصينية.", "g_security_s2": "يجب عادةً أن تكون السوائل في حقيبة اليد في عبوات صغيرة داخل كيس شفاف. تُصادر العبوات الكبيرة.", "g_security_s3": "امشِ عبر جهاز الفحص عندما يطلب الموظف. إن أصدر صوتًا فقد يفتشك الموظف يدويًا.", "g_security_s4": "استلم كل أغراضك من الصواني قبل أن تتابع.", "g_exitImmigration_title": "الجوازات (المغادرة)", "g_exitImmigration_intro": "يتحقّق موظف من جواز سفرك قبل مغادرة البلد.", "g_exitImmigration_s1": "قف في الطابور وانتظر خلف الخط حتى يُنادى عليك.", "g_exitImmigration_s2": "قدّم جواز سفرك وبطاقة الصعود. أجب عن الأسئلة بهدوء وببساطة.", "g_exitImmigration_s3": "قد يختم الموظف جوازك. تأكد أنك استعدته.", "g_exitImmigration_s4": "أنت الآن في منطقة المغادرة. لا تخرج منها.", "g_gates_title": "العثور على البوابة", "g_gates_intro": "البوابة هي المكان الذي تصعد منه إلى الطائرة. رقمها على بطاقة الصعود وعلى الشاشات.", "g_gates_s1": "ابحث عن رقم رحلتك على شاشات المغادرة. تُظهر البوابة ووقت الصعود.", "g_gates_s2": "قد تتغير البوابة. راجع الشاشات مرة أخرى واستمع إلى الإعلانات.", "g_gates_s3": "اذهب إلى بوابتك مبكرًا. بعض البوابات بعيدة.", "g_gates_s4": "إن ضللت الطريق، أرِ بطاقة الصعود لأي موظف في المطار واسأله.", "g_boarding_title": "الصعود إلى الطائرة", "g_boarding_intro": "الصعود هو دخول الركاب إلى الطائرة، وغالبًا على دفعات.", "g_boarding_s1": "يبدأ الصعود غالبًا قبل 30–60 دقيقة من الإقلاع. كن عند البوابة في الوقت المكتوب على بطاقة الصعود.", "g_boarding_s2": "انتظر حتى يُنادى على مجموعتك أو صف مقعدك.", "g_boarding_s3": "أظهر بطاقة الصعود وجواز السفر. سيمسح الموظفون بطاقة الصعود.", "g_boarding_s4": "ابحث عن رقم مقعدك على بطاقة الصعود. سيساعدك طاقم الطائرة.", "g_transit_title": "تغيير الطائرة (العبور)", "g_transit_intro": "إن كانت لديك رحلة متابعة، فاتبع لافتات العبور — عادةً لا تخرج من المطار.", "g_transit_s1": "عند نزولك من الطائرة، ابحث عن لافتات \"Transfer\" أو \"Transit\" أو \"Connecting flights\".", "g_transit_s2": "راجع الشاشات لمعرفة بوابة رحلتك التالية. قد تمرّ بالتفتيش الأمني مرة أخرى.", "g_transit_s3": "اسأل شركة الطيران قبل السفر إن كانت حقائبك ستُنقل مباشرة إلى وجهتك النهائية أو عليك استلامها.", "g_transit_s4": "إن كنت قلقًا بشأن الوقت، أرِ بطاقة الصعود لموظفي العبور واطلب المساعدة.", "g_arrivalImmigration_title": "الجوازات (الوصول)", "g_arrivalImmigration_intro": "عند وصولك، يقرّر موظف الجوازات إن كان يمكنك دخول البلد.", "g_arrivalImmigration_s1": "اتبع لافتات \"Arrivals\" أو \"Immigration\". في بعض الدول طوابير منفصلة للمواطنين والزوار.", "g_arrivalImmigration_s2": "جهّز جواز سفرك والتأشيرة (إن كنت تحتاج إليها) وأي وثائق مثل حجز الفندق أو خطاب الدعوة.", "g_arrivalImmigration_s3": "أجب بصدق عن الأسئلة: سبب زيارتك، ومدة إقامتك، وأين ستقيم.", "g_arrivalImmigration_s4": "قد تحتاج إلى ملء بطاقة وصول. اطلبها من طاقم الطائرة.", "g_baggageClaim_title": "استلام الحقائب", "g_baggageClaim_intro": "تخرج حقائبك المسجّلة على سير متحرك في صالة الأمتعة.", "g_baggageClaim_s1": "ابحث عن رقم رحلتك على الشاشات. تُظهر السير الذي ستصل عليه حقائبك.", "g_baggageClaim_s2": "تأكد أن الملصق على حقيبتك يطابق إيصال الأمتعة. حقائب كثيرة متشابهة.", "g_baggageClaim_s3": "إن لم تصل حقيبتك، اذهب إلى مكتب خدمة الأمتعة قبل مغادرة الصالة وأظهر الإيصال.", "g_baggageClaim_s4": "قد تمرّ بالجمارك. اتبع المسار الأخضر إن لم يكن لديك ما تصرّح به، أو الأحمر إن كان لديك.", "tip1_title": "احتفظ بنسخ من وثائقك", "tip1_body": "احفظ صورًا لجواز سفرك وتأشيرتك وتذكرتك، واحمل نسخة ورقية بعيدًا عن الأصول.", "tip2_title": "اذهب إلى المطار مبكرًا", "tip2_body": "قد يُغلق تسجيل الوصول للرحلات الدولية قبل ساعة أو أكثر من الإقلاع. اسأل شركة الطيران عن الوقت الدقيق.", "tip3_title": "زِن حقائبك في البيت", "tip3_body": "الوزن الزائد في المطار قد يكون مكلفًا. راجع الأمتعة المسموح بها في SafarCare وزِن حقائبك قبل الخروج.", "tip4_title": "اعرف ما لا يجوز وضعه في الحقيبة", "tip4_body": "لا يُسمح بالأدوات الحادة والسوائل الكبيرة في حقيبة اليد. البطاريات وشواحن الطاقة المحمولة يجب أن تكون في حقيبة اليد لا في الحقائب المسجّلة.", "tip5_title": "اشحن هاتفك", "tip5_body": "قد تكون بطاقة الصعود على هاتفك. اشحنه بالكامل واحمل الشاحن.", "tip6_title": "احمل بعض المال", "tip6_body": "احتفظ بمبلغ صغير لمطارات العبور. ليست كل الأماكن تقبل البطاقات نفسها.", "tip7_title": "الأدوية في حقيبة اليد", "tip7_body": "احتفظ بالأدوية التي تحتاجها في حقيبة اليد مع الوصفة أو رسالة من الطبيب.", "tip8_title": "اطلب المساعدة", "tip8_body": "يساعد موظفو الطيران والمطار المسافرين كل يوم. أظهر بطاقة الصعود واسأل — هذا أمر طبيع function findAirports(text){
  const out=[];
  const lines=text.split('\n'); let offset=0;
  for(const line of lines){
    const hasTime=/\b([01]?\d|2[0-3]):[0-5]\d\b/.test(line);
    const strong=[]; // unambiguous codes or bracketed codes in this line
    const cands=[];
    // City pairs like HGAADD
    for(const m of line.matchAll(/\b([A-Z]{3})([A-Z]{3})\b/g)){
      if(AIRPORTS[m[1]]&&AIRPORTS[m[2]]&&m[1]!==m[2]){cands.push({code:m[1],pos:offset+m.index,ok:true});cands.push({code:m[2],pos:offset+m.index+3,ok:true});}
    }
    for(const m of line.matchAll(/\b([A-Z]{3})\b/g)){
      const code=m[1]; if(!AIRPORTS[code]) continue;
      const before=line[m.index-1], after=line[m.index+3];
      const bracketed=before==='('&&after===')';
      const city=AIRPORTS[code].toUpperCase();
      const cityNear=line.includes(city.split(' ')[0]);
      cands.push({code,pos:offset+m.index,bracketed,cityNear,ok:!AMBIGUOUS.has(code)||bracketed||cityNear});
    }

      // An ambiguous code is accepted if the same line also has another
      // accepted airport, or a clock time (itinerary line).
      if(c.ok || okCount>=1&&cands.length>=2 || hasTime&&cands.length>=2) out.push({code:c.code,pos:c.pos});

function findFlights(text){
  const out=[];
  const re=/\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?-?\s?(\d{1,4})(?![\d:.]|\s?KG|\s?PC)\b/g;
  for(const m of text.matchAll(re)){
    const code=m[1];
    const known=!!AIRLINES[code];
    const ctx=text.slice(Math.max(0,m.index-25),m.index);
    const flightWord=/FLIGHT|FLT|VOL|RIHLA/.test(ctx);
    if(!known&&!flightWord) continue;
    if(/^\d+$/.test(code)) continue;
    out.push({code,number:m[2],pos:m.index,flight:code+' '+String(parseInt(m[2],10))});

function inferYear(day,month,now){
  let y=now.getFullYear();
  const d=new Date(y,month,day);
  if(d < new Date(now.getFullYear(),now.getMonth(),now.getDate()-60)) y+=1;
  return y;
}

function findDates(text,now){
  const out=[];
  const mon='(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[A-Z]*\\.?';
  const add=(pos,len,y,mo,d)=>{ if(mo<0||mo>11||d<1||d>31) return; if(y<2000||y>2100) return; out.push({pos,len,y,mo,d}); };
  // 19NOV26, 19 NOV 2026, 19 November 2026, THU 19NOV
  for(const m of text.matchAll(new RegExp('\\b(\\d{1,2})\\s?-?'+mon+'\\s?-?,?\\s?(\\d{4}|\\d{2}(?![:\\d]))?','g'))){

    let y=m[3]?+m[3]:null; if(y!==null&&y<100) y+=2000; if(y===null) y=inferYear(d,mo,now);

  for(const m of text.matchAll(/\b(20\d{2})-(\d{2})-(\d{2})\b/g)) add(m.index,m[0].length,+m[1],+m[2]-1,+m[3]);

  for(const m of text.matchAll(/\b(\d{1,2})[\/.](\d{1,2})[\/.](20\d{2}|\d{2})\b/g)){

  }
  // drop overlaps (keep longest earliest)
  out.sort((a,b)=>a.pos-b.pos||b.len-a.len);
  const res=[]; let end=-1;
  for(const d of out){ if(d.pos>=end){res.push(d); end=d.pos+d.len;} }

}

function findTimes(text){
  const out=[];

  const lines=text.split('\n'); let off=0;
  for(const line of lines){
    if(/\b[A-Z]{6}\b/.test(line) && [...line.matchAll(/\b([A-Z]{3})([A-Z]{3})\b/g)].some(m=>AIRPORTS[m[1]]&&AIRPORTS[m[2]])){

    }
    off+=line.length+1;

}

function between(list,start,end){return list.filter(x=>x.pos>=start&&x.pos<end);}

      const prevNl=text.lastIndexOf('\n',f.pos-1);

function findPassenger(text){
  let m=text.match(/\b([A-Z][A-Z'-]{1,})\/([A-Z][A-Z'-]+(?: (?!(?:MR|MRS|MS|MISS|MSTR|DR|CHD|INF)\b)[A-Z][A-Z'-]+)*)(?:\s?(MR|MRS|MS|MISS|MSTR|DR|CHD|INF))?\b/);

  m=text.match(/\b(?:PASSENGER(?:\s?NAME)?|TRAVELL?ER(?:\s?NAME)?|NAME OF PASSENGER)\s*[:\-]?\s*(?:\n\s*)?(?:(?:MR|MRS|MS|MISS|DR)\.?\s)?([A-Z][A-Z'-]+(?: [A-Z][A-Z'-]+){1,3})\b/);
  if(m&&!/^(DETAILS|INFORMATION|TYPE|ADULT)/.test(m[1])) return m[1].replace(/\s(MR|MRS|MS|MISS)$/,'').trim();
  m=text.match(/^\s*(?:MR|MRS|MS|MISS|MSTR|DR)\.?\s([A-Z][A-Z'-]+(?: [A-Z][A-Z'-]+){1,3})\s*$/m);
  if(m) return m[1];
  return null;
}

function findBookingRef(text){
  const re=/\b(?:BOOKING\s?(?:REF(?:ERENCE)?|CODE|NUMBER|ID)|PNR|RECORD\s?LOCATOR|RESERVATION\s?(?:CODE|NUMBER|REF(?:ERENCE)?)|CONFIRMATION\s?(?:CODE|NUMBER)|AIRLINE\s?(?:REF(?:ERENCE)?|BOOKING\s?REF(?:ERENCE)?))\.?\s?(?:NO\.?|#)?\s?[:\-]?\s*(?:\n\s*)?([A-Z0-9]{5,8})\b/g;
  for(const m of text.matchAll(re)){
    const v=m[1];
    if(/[A-Z]/.test(v)&&/^[A-Z0-9]+$/.test(v)&&!['NUMBER','CODE','STATUS','DETAILS','ISSUED'].includes(v)) return v;
  }
  return null;
}

function findClass(text){
  const m=text.match(/\b(PREMIUM ECONOMY|ECONOMY|BUSINESS|FIRST)(?:\s?CLASS)?\b/);
  return m?m[1].charAt(0)+m[1].slice(1).toLowerCase():null;
}
function findFare(text){
  let m=text.match(/\bFARE\s?(?:TYPE|FAMILY|BRAND)\s*[:\-]?\s*([A-Z][A-Z ]{2,20}?)\s*(?:\n|$|  )/);
  if(m) return m[1].trim();
  m=text.match(/\bFARE\s?BASIS\s*[:\-]?\s*([A-Z0-9]{3,10})\b/);
  return m?m[1]:null;
}
function findTerminal(text){const m=text.match(/\bTERMINAL\s*[:\-]?\s*([A-Z0-9]{1,3})\b/);return m?m[1]:null;}
function findGate(text){const m=text.match(/\bGATE\s*[:\-]?\s*([A-Z]?\d{1,3}[A-Z]?)\b/);return m?m[1]:null;}

// ---------- baggage ----------
const CABIN_WORDS=/CABIN|HAND\s?(?:BAG|LUGGAGE|BAGGAGE)|CARRY[\s-]?ON|PERSONAL ITEM|HAND$/;
const CHECKED_WORDS=/CHECKED|CHECK[\s-]?IN BAG|HOLD|FREE BAG|BAGGAGE|LUGGAGE|BAG ALLOWANCE|\bBAGS?\b/;
const SALES_WORDS=/EXTRA|EXCESS|ADDITIONAL|PURCHASE|\bBUY\b|\bFEE|USD|\$|ETB|AED|EUR|PER KG|PRE-?PAID|UPGRADE/;

function findBaggage(text){
  const lines=text.split('\n');
  const checked=[], cabin=[];
  for(let li=0;li<lines.length;li++){
    const line=lines[li];
    if(SALES_WORDS.test(line)) continue;
    const toks=[];
    const taken=[];
    const push=(m,a)=>{ taken.push([m.index,m.index+m[0].length]); toks.push({...a,raw:m[0].trim(),idx:m.index}); };
    for(const m of line.matchAll(/\b(\d{1,2})\s?[X×*]\s?(\d{1,2})\s?KGS?\b/g)) push(m,{pieces:+m[1],kgPerPiece:+m[2]});
    for(const m of line.matchAll(/\b(\d{1,2})\s?(?:PCS?|PIECES?)\b(?:\s?(?:OF|X|@|,|\/)?\s?(?:UP TO|MAX\.?|MAX)?\s?(\d{1,2})\s?KGS?\b)?/g)){
      if(taken.some(([s,e])=>m.index>=s&&m.index<e)) continue;
      push(m,{pieces:+m[1],kgPerPiece:m[2]?+m[2]:null});
    }
    for(const m of line.matchAll(/\b(\d{1,3})\s?KGS?\b/g)){
      if(taken.some(([s,e])=>m.index>=s&&m.index<e)) continue;
      push(m,{totalKg:+m[1]});
    }
    for(const m of line.matchAll(/\b(NIL|NO)\s(?:CHECKED\s)?BAG(?:GAGE)?S?\b/g)) push(m,{pieces:0});
    for(const t of toks){
      const ctx=(lines[li-1]&&!/\d/.test(lines[li-1])?lines[li-1]+' ':'')+line.slice(0,t.idx);
      const after=line.slice(t.idx+t.raw.length);
      let kind=null;
      if(CABIN_WORDS.test(ctx)) kind='cabin';
      else if(CHECKED_WORDS.test(ctx)) kind='checked';
      else if(CABIN_WORDS.test(after)) kind='cabin';
      else if(/^\s?(CHECKED|CHECK[\s-]?IN)/.test(after)) kind='checked';

      const li2=(re)=>{let r=-1;for(const m of ctx.matchAll(re)) r=m.index;return r;}; const lastCabin=li2(/CABIN|HAND|CARRY/g), lastChecked=li2(/CHECKED|CHECK[\s-]?IN|HOLD/g);

      if(lastChecked>=0&&lastCabin>lastChecked) kind='cabin';
      if(kind==='cabin') cabin.push(t); else if(kind==='checked') checked.push(t);
    }

}
function compatible(a,b){
  const k=['pieces','kgPerPiece','totalKg'];

function merge(list){

  let acc={pieces:null,kgPerPiece:null,totalKg:null,raw:[]};
  for(const t of list){
    if(!compatible(acc,t)) return {status:'conflict',raw:list.map(x=>x.raw)};
    for(const k of ['pieces','kgPerPiece','totalKg']) if(t[k]!=null) acc[k]=t[k];
    if(!acc.raw.includes(t.raw)) acc.raw.push(t.raw);

  if(acc.pieces!=null&&acc.totalKg!=null&&acc.kgPerPiece==null){acc.kgPerPiece=acc.totalKg;acc.totalKg=null;}
  return {status:'found',...acc};
}

function parse(raw,now=new Date()){
  const text=norm(raw);

    terminal:findTerminal(text), gate:findGate(text),

}

// ---------- navigation ----------
const cur = () => S.stack[S.stack.length - 1];
function go(r, p = {}) { S.stack.push({ r, ...p }); render(true); }
function back() { if (S.stack.length > 1) S.stack.pop(); render(true); }
function tab(name) { S.tab = name; S.stack = [{ r: name }]; render(true); }
function toast(msg) { S.toast = msg; render(); setTimeout(() => { S.toast = null; render(); }, 2600); }

// ---------- shared UI pieces ----------
const appbar = (title, sub, withBack = true, extra = '') => `<header class="appbar">${withBack ? `<button class="iconbtn" data-a="back" aria-label="Back">${ic('back', 20, 'flip')}</button>` : ''}<div class="grow"><h1>${esc(title)}</h1>${sub ? `<div class="muted small">${esc(sub)}</div>` : ''}</div>${extra}</header>`;
const banner = (msg, tone = 'info', title = '', action = '') => `<div class="banner ${tone}">${ic(tone === 'warn' ? 'warn' : tone === 'ok' ? 'check' : 'info', 20)}<div>${title ? `<b>${esc(title)}</b>` : ''}<div>${esc(msg)}</div>${action}</div></div>`;
const notFound = () => `<span class="nf">${esc(t('notFound'))}</span>`;
function bagCard(a, cabin, editAction) {
  const label = t(cabin ? 'cabinBaggage' : 'checkedBaggage');

    const st = a && a.status === 'conflict' ? t('bagConflict') : t('notFound');

}

function readText(text) {
  S.scanError = null; S.reading = true; render();
  setTimeout(() => {
    S.reading = false;
    let p; try { p = parse(text); } catch (e) { S.scanError = 'scanErrFailed'; render(); return; }
    if (!p.segments.length && !(p.bookingRef && p.airline)) { S.scanError = text.replace(/\s/g, '').length < 25 ? 'scanErrUnreadable' : 'scanErrNotTicket'; render(); return; }
    const segs = p.segments.map((s, i) => ({ from: s.from, to: s.to, flight: s.flight, dep: s.dep, arr: s.arr, terminal: i === 0 ? p.terminal : null, gate: i === 0 ? p.gate : null }));
    const bag = b => b.status === 'found' ? { pieces: b.pieces, kgPerPiece: b.kgPerPiece, totalKg: b.totalKg, raw: b.raw.join(' · '), source: 'ticket', status: 'found' } : { status: b.status };
    S.draft = { passenger: p.passenger, airline: p.airline, bookingRef: p.bookingRef, cls: p.cls, fare: p.fare, segments: segs, checked: bag(p.baggage.checked), cabin: bag(p.baggage.cabin) };
    go('confirm');
  }, 900);
}

function ckText(c, tr) {
  if (c.kind === 'custom') return [c.label, ''];
  if (c.kind === 'baggage') { const a = tr.checkedBaggage; return [t('ck_baggage'), a && (a.pieces != null || a.totalKg != null) ? bagTitle(a) : t('ck_baggage_hint_unknown')]; }
  if (c.kind === 'visaCheck') return [t('ck_visaCheck'), t('ck_visaCheck_hint', { place: airport(dest(tr)) })];
  if (c.kind === 'transitDocuments') return [t('ck_transitDocuments'), t('ck_transitDocuments_hint', { stops: stops(tr).join(', ') })];
  return [t('ck_' + c.kind), t('ck_' + c.kind + '_hint')];
}
const progress = (done, total, title) => `<div class="row prog"><div class="ringp" style="--p:${total ? done / total * 100 : 0}"><span>${total ? Math.round(done / total * 100) : 0}%</span></div><div><div class="h3">${esc(title)}</div><div class="muted small">${esc(t('ckProgress', { done, total }))}</div></div></div>`;

const RQ = { passportValidity: ['passport', 'rq_passport_title'], visaCheck: ['bank', 'rq_visa_title'], transitDocuments: ['link', 'rq_transit_title'], insuranceAndDocuments: ['shield', 'rq_other_title'] };
function rqBody(r, tr) {

  return t('rq_other_body');
}

  return `${head}<div class="scroll pad">${progress(tr.reminders.filter(r => r.checked).length, tr.reminders.length, `${origin(tr)} → ${dest(tr)}`)}${banner(t('rqDisclaimer'))}
  ${tr.reminders.map(r => { const [i, k] = RQ[r.kind]; return `<div class="card row top"><span class="tile accent">${ic(i, 20)}</span><div class="grow"><b>${esc(t(k))}</b><div class="small">${esc(rqBody(r, tr))}</div>${r.note ? `<div class="xs note">“${esc(r.note)}”</div>` : ''}${r.kind === 'passportValidity' ? `<label class="link">${esc(t(tr.passportExpiry ? 'rqChangeExpiry' : 'rqAddExpiry'))}<input type="date" data-exp="${tr.id}" class="hiddendate"></label>` : ''}<button class="link" data-a="note:${tr.id}:${r.id}">${esc(t(r.note ? 'rqEditNote' : 'rqAddNote'))}</button></div><label class="cbx solo"><input type="checkbox" ${r.checked ? 'checked' : ''} data-rq="${tr.id}:${r.id}" aria-label="${esc(t(r.checked ? 'rqMarkUnchecked' : 'rqMarkChecked', { item: t(k) }))}"></label></div>`; }).join('')}
  <h2>${esc(t('rqMyItems'))}</h2><div class="card nopad">${custom.map(c => `<div class="ck"><label class="cbx"><input type="checkbox" ${c.done ? 'checked' : ''} data-ck="${tr.id}:${c.id}"><span><b>${esc(c.label)}</b></span></label><button class="iconbtn" data-a="rmck:${tr.id}:${c.id}" aria-label="${esc(t('delete'))}">${ic('trash', 16)}</button></div>`).join('')}
  <form class="addrow" data-add="${tr.id}"><input name="item" maxlength="80" placeholder="${esc(t('ckAddHint'))}" aria-label="${esc(t('ckAdd'))}"><button class="btn small-btn">${ic('plus', 16)}</button></form></div><p class="muted xs">${esc(t('rqMyItemsHint'))}</p></div>`;
};

screens.baggage = () => {
  const ups = sorted().filter(upcoming);
  return `${appbar(t('baggageChecker'))}<div class="scroll pad">${!ups.length ? banner(t('bcNoTripBody'), 'info', t('bcNoTripTitle'), `<button class="link" data-a="tab:scan">${esc(t('scanButton'))}</button>`) : ups.map(tr => `<div class="sect"><h2>${origin(tr)} → ${dest(tr)}</h2><button class="link" data-a="trip:${tr.id}">${esc(t('viewTrip'))}</button></div>${bagCard(tr.checkedBaggage, false)}${bagCard(tr.cabinBaggage, true)}`).join('')}
  <h2>${esc(t('bcCodesTitle'))}</h2><div class="card">${[['1PC · 2PC', 'bcCodePc'], ['23KG · 30KG', 'bcCodeKg'], ['2PC 23KG', 'bcCodePcKg'], ['0PC · NIL', 'bcCodeNil']].map(([c, k]) => `<div class="code-row"><b class="acc">${c}</b><div class="small">${esc(t(k))}</div></div>`).join('')}<div class="muted xs">${esc(t('bcCabinNote'))}</div></div>${banner(t('bcDisclaimer'))}</div>`;
};

const TOPICS = [['checkin', 'desk'], ['security', 'shield'], ['exitImmigration', 'passport'], ['gates', 'link'], ['boarding', 'ticket'], ['transit', 'plane'], ['arrivalImmigration', 'user'], ['baggageClaim', 'bag']];
I.desk = '<path d="M3 10h18v4H3zM6 14v6M18 14v6M8 6h8v4H8z"/>';
screens.guide = () => `${appbar(t('airportGuide'))}<div class="scroll pad"><p class="muted">${esc(t('guideIntro'))}</p>${TOPICS.map(([id, icn], i) => `${i === 0 ? `<h3 class="acc">${esc(t('guideDeparting'))}</h3>` : id === 'transit' ? `<h3 class="acc">${esc(t('guideConnecting'))}</h3>` : id === 'arrivalImmigration' ? `<h3 class="acc">${esc(t('guideArriving'))}</h3>` : ''}<div class="path"><span class="num">${i + 1}</span><button class="card row grow" data-a="topic:${id}">${ic(icn, 22, 'acc')}<div class="grow"><b>${esc(t(`g_${id}_title`))}</b><div class="muted xs clamp">${esc(t(`g_${id}_intro`))}</div></div>${ic('chev', 18, 'muted flip')}</button></div>`).join('')}</div>`;
screens.topic = ({ id }) => { const i = TOPICS.findIndex(x => x[0] === id), nx = TOPICS[i + 1]; return `${appbar(t(`g_${id}_title`))}<div class="scroll pad"><div class="illus">${ic(TOPICS[i][1], 40)}</div><p class="lead">${esc(t(`g_${id}_intro`))}</p>${[1, 2, 3, 4].map(s => `<div class="step"><span class="num soft">${s}</span><p>${esc(t(`g_${id}_s${s}`))}</p></div>`).join('')}${nx ? `<button class="btn ghost" data-a="topicnext:${nx[0]}">${esc(t('guideNext', { step: t(`g_${nx[0]}_title`) }))}</button>` : ''}</div>`; };
screens.tips = () => `${appbar(t('travelTips'))}<div class="scroll pad">${['file', 'home', 'bag', 'warn', 'scan', 'trips', 'shield', 'user'].map((icn, i) => `<div class="card row top">${ic(icn, 22, 'acc')}<div><b>${esc(t(`tip${i + 1}_title`))}</b><div class="small">${esc(t(`tip${i + 1}_body`))}</div></div></div>`).join('')}</div>`;

screens.settings = () => {
  const opt = (name, val, label, on) => `<label class="radio"><input type="radio" name="${name}" value="${val}" ${on ? 'checked' : ''}><span>${esc(label)}</span></label>`;
  return `${appbar(t('settings'), '', false)}<div class="scroll pad">
  <div class="glabel">${esc(S.lang === 'ar' ? t('sectionPreferences') : t('sectionPreferences').toUpperCase())}</div>
  <div class="card"><div class="row">${ic('home', 20)}<b class="grow">${esc(t('language'))}</b></div><div class="seg">${opt('lang', 'en', 'English', S.lang === 'en')}${opt('lang', 'so', 'Soomaali', S.lang === 'so')}${opt('lang', 'ar', 'العربية', S.lang === 'ar')}</div>
  <div class="row mt">${ic('settings', 20)}<b class="grow">${esc(t('appearance'))}</b></div><div class="seg">${opt('theme', 'light', t('themeLight'), S.theme === 'light')}${opt('theme', 'dark', t('themeDark'), S.theme === 'dark')}</div>
  <label class="row mt switch"><span class="grow"><b>${esc(t('notifications'))}</b><div class="muted xs">${esc(t('notifSettingHint'))}</div></span><input type="checkbox" data-notif ${S.notif ? 'checked' : ''}></label></div>
  <div class="glabel">${esc(S.lang === 'ar' ? t('sectionAccount') : t('sectionAccount').toUpperCase())}</div>
  <div class="card nopad"><button class="frow" data-a="go:account">${ic('user', 20)}<span class="grow"><b>${esc(t('signIn'))}</b><div class="muted xs">${esc(t('signInOptional'))}</div></span>${ic('chev', 16, 'muted flip')}</button><button class="frow" data-a="go:privacy">${ic('lock', 20)}<b class="grow">${esc(t('privacy'))}</b>${ic('chev', 16, 'muted flip')}</button></div>
  <div class="glabel">${esc(S.lang === 'ar' ? t('sectionAbout') : t('sectionAbout').toUpperCase())}</div>
  <div class="card"><div class="row">${logo(40)}<div><b>SafarCare</b><div class="acc small">${esc(t('tagline'))}</div></div></div><p class="small">${esc(t('aboutBody'))}</p></div>
  <p class="center muted xs">${esc(t('version'))} 1.0.0 · web preview</p></div>`;
};
screens.account = () => `${appbar(t('account'))}<div class="scroll pad">${empty('user', t('accountsOffTitle'), t('accountsOffBody'))}</div>`;
screens.privacy = () => `${appbar(t('privacy'))}<div class="scroll pad">${[['scan', 'read'], ['lock', 'store'], ['trips', 'cloud'], ['bulb', 'smart'], ['shield', 'share'], ['trash', 'delete']].map(([i, k]) => `<div class="card row top">${ic(i, 22, 'acc')}<div><b>${esc(t(`pv_${k}_title`))}</b><div class="small">${esc(t(`pv_${k}_body`))}</div></div></div>`).join('')}<button class="btn danger" data-a="wipe">${esc(t('pvDeleteAll'))}</button></div>`;

// ---------- dialogs ----------
function dialog(title, bodyHtml, onOk, okLabel = t('done'), danger = false) {
  const el = document.getElementById('dlg');
  el.innerHTML = `<form class="dlg" method="dialog"><h2>${esc(title)}</h2>${bodyHtml}<div class="row end-row"><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button><button class="btn ${danger ? 'danger' : ''}">${esc(okLabel)}</button></div></form>`;
  el.hidden = false;
  const form = el.querySelector('form');
  el.querySelector('[data-close]').onclick = () => { el.hidden = true; };
  form.onsubmit = e => { e.preventDefault(); const fd = Object.fromEntries(new FormData(form)); el.hidden = true; onOk(fd); };
  const first = form.querySelector('input,textarea'); (first || form.querySelector('button')).focus();
}
const textDlg = (title, val, cb, extra = '') => dialog(title, `<input name="v" value="${esc(val || '')}" maxlength="200" placeholder="${esc(t('leaveEmptyIfUnknown'))}" ${extra}>`, f => cb(f.v.trim()));
function bagDlg(cabin, a, cb) {
  dialog(t(cabin ? 'cabinBaggage' : 'checkedBaggage'), `<p class="small">${esc(t('bagManualHelp'))}</p><label class="fl">${esc(t('bagPiecesLabel'))}<input name="p" inputmode="numeric" value="${a?.pieces ?? ''}"></label><label class="fl">${esc(t('bagKgPerPieceLabel'))}<input name="k" inputmode="numeric" value="${a?.kgPerPiece ?? ''}"></label><label class="fl">${esc(t('bagTotalKgLabel'))}<input name="tk" inputmode="numeric" value="${a?.totalKg ?? ''}"></label>`, f => {
    const n = (v, max) => { const x = parseInt(v, 10); return Number.isFinite(x) && x >= 0 && x <= max ? x : null; };
    const r = { pieces: n(f.p, 9), kgPerPiece: n(f.k, 50), totalKg: n(f.tk, 150), source: 'manual', status: 'found' };
    cb(r.pieces != null || r.totalKg != null ? r : { status: 'notFound' });
  });
}
function routeDlg(from, to, cb) {
  dialog(t('routeTitle'), `<label class="fl">${esc(t('routeFrom'))}<input name="f" maxlength="3" value="${esc(from || '')}" required pattern="[A-Za-z]{3}"></label><label class="fl">${esc(t('routeTo'))}<input name="t" maxlength="3" value="${esc(to || '')}" required pattern="[A-Za-z]{3}"></label><p class="muted xs">${esc(t('airportCodeExample'))}</p>`, f => cb(f.f.toUpperCase(), f.t.toUpperCase()));
}

// ---------- actions ----------
const findTrip = id => S.trips.find(x => x.id === id);
function act(a) {
  const [k, x, y, z] = a.split(':');
  const d = S.draft;
  switch (k) {
    case 'back': return back();
    case 'tab': return tab(x);
    case 'go': return go(x);
    case 'trip': return go('trip', { id: x });
    case 'checklist': return go('checklist', { id: x });
    case 'reqtrip': return go('requirements', { id: x });
    case 'topic': return go('topic', { id: x });
    case 'topicnext': S.stack[S.stack.length - 1] = { r: 'topic', id: x }; return render(true);
    case 'sample': return readText(sampleTickets()[+x].text);
    case 'readpaste': return readText(document.getElementById('paste').value || '');
    case 'ed': { const key = { passenger: 'fieldPassenger', airline: 'fieldAirline', bookingRef: 'fieldBookingRef', cls: 'fieldClass', fare: 'fieldFare' }[x]; return textDlg(t(key), d[x], v => { d[x] = v || null; render(); }); }
    case 'eds': { const key = { flight: 'fieldFlight', terminal: 'fieldTerminal', gate: 'fieldGate' }[y]; return textDlg(t(key), d.segments[+x][y], v => { d.segments[+x][y] = v ? v.toUpperCase() : null; render(); }); }
    case 'edt': { const s = d.segments[+x], cur = s[y] || s.dep || new Date(); const iso = `${cur.getFullYear()}-${two(cur.getMonth() + 1)}-${two(cur.getDate())}T${two(cur.getHours())}:${two(cur.getMinutes())}`; return dialog(t(y === 'dep' ? 'fieldDeparture' : 'fieldArrival'), `<input type="datetime-local" name="v" value="${iso}">`, f => { s[y] = f.v ? new Date(f.v) : null; render(); }); }
    case 'rmseg': d.segments.splice(+x, 1); return render();
    case 'addseg': return routeDlg(d.segments.at(-1)?.to, '', (f, to) => { d.segments.push({ from: f, to, flight: null, dep: null, arr: null }); render(); });
    case 'bag': return bagDlg(x === 'cabin', d[x], r => { d[x] = r; render(); });
    case 'save': {
      if (!d.segments.length) return toast(t('saveNeedsFlight'));
      const fb = b => b && b.status === 'found' ? b : null;
      const tr = { id: uid(), passenger: d.passenger, airline: d.airline, bookingRef: d.bookingRef, cls: d.cls, fare: d.fare, segments: d.segments, checkedBaggage: fb(d.checked), cabinBaggage: fb(d.cabin), passportExpiry: null };
      tr.checklist = defaultChecklist(tr); tr.reminders = defaultReminders(tr);
      S.trips.push(tr); S.draft = null; persist(); S.tab = 'trips'; S.stack = [{ r: 'trips' }, { r: 'trip', id: tr.id }]; return render(true);
    }
    case 'tbag': { const tr = findTrip(x); return bagDlg(y === 'cabinBaggage', tr[y], r => { tr[y] = r.status === 'found' ? r : null; persist(); render(); }); }
    case 'deltrip': return dialog(t('tripDeleteTitle'), `<p>${esc(t('tripDeleteBody'))}</p>`, () => { S.trips = S.trips.filter(tt => tt.id !== x); persist(); tab('trips'); }, t('delete'), true);
    case 'rmck': { const tr = findTrip(x); tr.checklist = tr.checklist.filter(c => c.id !== y); persist(); return render(); }
    case 'note': { const tr = findTrip(x), r = tr.reminders.find(q => q.id === y); return textDlg(t('rqNote'), r.note, v => { r.note = v; persist(); render(); }); }
    case 'wipe': return dialog(t('pvDeleteAllTitle'), `<p>${esc(t('pvDeleteAllBody'))}</p>`, () => { S.trips = []; persist(); toast(t('pvDeleted')); tab('home'); }, t('delete'), true);
  }
}

// ---------- render ----------
function render(scrollTop) {
  const root = document.getElementById('phone');
  document.documentElement.lang = S.lang; root.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  root.dataset.theme = S.theme; document.body.dataset.theme = S.theme;
  const c = cur(); const showTabs = ['home', 'trips', 'scan', 'requirements', 'settings'].includes(S.stack[0].r) && (S.stack.length === 1 || c.r !== 'confirm');
  const nav = (name, icn, key) => `<button class="nav ${S.tab === name ? 'on' : ''}" data-a="tab:${name}" aria-current="${S.tab === name ? 'page' : 'false'}">${ic(icn, 22)}<span>${esc(t(key))}</span></button>`;
  const prevScroll = root.querySelector('.scroll')?.scrollTop || 0;
  root.innerHTML = `<div class="screen">${screens[c.r](c)}</div>${showTabs && c.r !== 'confirm' ? `<nav class="tabs">${nav('home', 'home', 'navHome')}${nav('trips', 'trips', 'navTrips')}<button class="fab ${S.tab === 'scan' ? 'on' : ''}" data-a="tab:scan" aria-label="${esc(t('navScan'))}">${ic('scan', 26)}</button>${nav('requirements', 'req', 'navRequirements')}${nav('settings', 'settings', 'navSettings')}</nav>` : ''}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  const sc = root.querySelector('.scroll'); if (sc && !scrollTop) sc.scrollTop = prevScroll;
}

document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.closest('#dlg')) { e.preventDefault(); act(b.dataset.a); } });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-a]')) { e.preventDefault(); act(e.target.dataset.a); } if (e.key === 'Escape') document.getElementById('dlg').hidden = true; });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.name === 'lang') { S.lang = el.value; persist(); return render(); }
  if (el.name === 'theme') { S.theme = el.value; persist(); return render(); }
  if (el.dataset.notif !== undefined) { S.notif = el.checked; persist(); return; }
  if (el.dataset.ck) { const [a, b] = el.dataset.ck.split(':'); const c = findTrip(a).checklist.find(q => q.id === b); c.done = el.checked; persist(); return render(); }
  if (el.dataset.rq) { const [a, b] = el.dataset.rq.split(':'); const r = findTrip(a).reminders.find(q => q.id === b); r.checked = el.checked; persist(); return render(); }
  if (el.dataset.exp) { const tr = findTrip(el.dataset.exp); tr.passportExpiry = el.value ? new Date(el.value + 'T00:00') : null; persist(); return render(); }
  if (el.dataset.file !== undefined && el.files[0]) {
    const f = el.files[0];
    if (f.size > 15 * 1024 * 1024) { S.scanError = 'scanErrTooLarge'; return render(); }
    S.scanError = null; toast('Preview: photo and PDF reading runs on the phone in the real app. Try a sample ticket or paste the text below.');
  }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.add) return; e.preventDefault();
  const v = f.item.value.trim(); if (!v) return; findTrip(f.dataset.add).checklist.push({ id: uid(), kind: 'custom', label: v, done: false }); persist(); render();
});
render(true);

</script>
</body>
</html>
